name: Deploy Server to VPS

on:
    push:
        branches: [main]
        paths:
            - 'server/**'
            - 'src/**'
            - 'scripts/**'
            - 'package.json'
            - 'yarn.lock'
            - 'target.txt'
            - '.github/workflows/deploy-server.yml'
    workflow_dispatch:

concurrency:
    group: deploy-vps
    cancel-in-progress: false

jobs:
    deploy:
        # Only the fork owns the VPS; never fire if this file reaches another repo.
        if: github.repository == 'GorgonUK/xrsps-typescript'
        runs-on: ubuntu-latest
        steps:
            - name: Configure SSH
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

            - name: Deploy and restart service
              run: |
                  ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
                      "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
